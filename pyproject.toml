[project]
name = "python-postgres-devcontainer-example"
version = "0.1.0"
description = "Example setup for a Python PostgreSQL DevContainer project."
readme = "README.md"
authors = [
    { name = "Rajdeep Sandhu", email = "168480080+rajdeep-sandhu@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.2",
]

[project.scripts]
python-postgres-devcontainer-example = "python_postgres_devcontainer_example:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]
